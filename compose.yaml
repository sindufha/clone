name: nexus-lms
services:
  web:
    image: nexus-lms:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      WORKER_URL: http://worker:4001
      NODE_OPTIONS: --max-old-space-size=192
      DB_POOL_MAX: 3
    ports:
      - "127.0.0.1:4000:4000"
    mem_limit: 256m
    init: true
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  worker:
    image: nexus-lms:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["node", "dist-server/server/worker.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      WORKER_PORT: 4001
      WORKER_BIND: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=256
      DB_POOL_MAX: 2
    mem_limit: 384m
    init: true
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
